name: Build Android

# Port of .tangled/workflows/build-android.yml. Tangled pinned this to manual
# runs on main; here the build can be dispatched on any branch, but only runs
# on main publish a GitHub release.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      architectures:
        type: string
        description: >-
          ABIs to compile into the APK, comma separated. Leave empty to build
          every ABI in android/gradle.properties. The APK is universal, so
          limiting this only drops architectures some devices cannot use.
        required: false
        default: "armeabi-v7a,arm64-v8a"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # React Native is compiled from source (expo-build-properties
    # buildReactNativeFromSource), so expect this to take the better part of
    # an hour on a 4-core runner.
    timeout-minutes: 180
    permissions:
      # softprops/action-gh-release creates the tag and release
      contents: write
    env:
      # EXPO_PUBLIC_* values are inlined into the bundle at build time, so they
      # have to be set here. A value set anywhere later is too late.
      EXPO_PUBLIC_ENV: production
      EXPO_PUBLIC_OAUTH_BASE_URL: ${{ vars.OAUTH_BASE_URL || 'https://witchsky.app' }}
      EXPO_PUBLIC_APP_NAME: ${{ vars.APP_NAME || 'Witchsky' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      EXPO_PUBLIC_BUNDLE_IDENTIFIER: ${{ github.sha }}
      # Version code has to increase for every published release, otherwise
      # Android refuses to install the update over the existing app. This is
      # what EAS's autoIncrement does for the store builds.
      BSKY_ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Production is what makes app.config.js turn OTA updates on, and the
      # update channel is Bluesky's (updates.bsky.app), not ours. Left on, the
      # APK would poll for a bundle matching this runtime version and could pull
      # one that was never built from this source.
      DISABLE_UPDATES: "1"
      # There is no Sentry auth token here, and the upload task fails without
      # one. See the sideload-android EAS profile and the local build script.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      # package.json requires node >=24.22.1 and devEngines pins pnpm 11.28.5.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      # React Native and the app target Java 17 (see ReactAndroid's
      # sourceCompatibility); Gradle 9.4 supports it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # `cache-provider: basic` keeps this on @actions/cache. The default in v6
      # is gradle-actions-caching, which is licensed separately from the action.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # A from-source React Native build does not fit in the default runner
      # disk, so drop toolchains this build has no use for.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            "$ANDROID_HOME/system-images" \
            "$ANDROID_HOME/emulator"
          sudo docker image prune --all --force || true
          df -h /

      # The runner image installs the SDK but does not put cmdline-tools on
      # PATH, so `sdkmanager` is not a command until we add it.
      - name: Add sdkmanager to PATH
        run: |
          bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$bin/sdkmanager" ]; then
            bin=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 \
              -name sdkmanager -type f | head -1)")
          fi
          test -x "$bin/sdkmanager"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # React Native resolves its NDK from `ext.ndkVersion`, which the Expo
      # Gradle plugin fills in from its version catalog (27.1.12297006 for this
      # React Native release). The runner image ships 27.3, 29 and 30 instead.
      # API 37 platforms are published per minor version and compileSdk 37 is
      # satisfied only by "android-37.0". CMake is pinned to the version
      # ReactAndroid/build.gradle.kts asks for; the image has 3.31.5, and AGP
      # fails rather than substituting when the requested one is missing.
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.30.5"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Relative to the run, so the ordering matches .env.example's YYMMDDHH.
      - name: Write build metadata
        run: |
          version=$(node --print "require('./package.json').version")
          bundle_date=$(date -u +%y%m%d%H)
          echo "EXPO_PUBLIC_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUNDLE_DATE=$bundle_date" >> "$GITHUB_ENV"

      # app.config.js points android.googleServicesFile at this path and it is
      # gitignored, so the checked-in example stands in for a real project.
      - name: Copy example build settings
        run: cp google-services.json.example google-services.json

      # Same as `just intl:build`: the fork has no nightly catalog job, so the
      # committed .po files drift and a build would otherwise ship message IDs.
      - name: Build translations
        run: pnpm intl:build

      # Same as the justfile's `prebuild-android`. android/ is gitignored, so
      # the native project is generated from app.config.js on every run.
      - name: Prebuild native project
        run: pnpm exec expo prebuild -p android
        env:
          EXPO_NO_GIT_STATUS: "1"

      # Same as the justfile's `build-android-gradle`. android/gradle.properties
      # builds all four ABIs by default, which is hours of extra native
      # compilation; x86/x86_64 only matter to emulators, so default to the arm
      # pair and let the dispatch input override it.
      - name: Build
        working-directory: android
        env:
          ARCHITECTURES: ${{ inputs.architectures || 'armeabi-v7a,arm64-v8a' }}
        run: |
          args=()
          if [ -n "$ARCHITECTURES" ]; then
            args+=("-PreactNativeArchitectures=$ARCHITECTURES")
          fi
          chmod +x gradlew
          ./gradlew app:assembleRelease "${args[@]}"

      - name: Rename APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          mv "$apk" "android/app/build/outputs/apk/release/witchsky-v${{ github.run_number }}.apk"
          ls -lh android/app/build/outputs/apk/release/witchsky-v${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/witchsky-v${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v3
        if: github.ref_name == 'main'
        with:
          name: Witchsky v${{ github.run_number }}
          tag_name: witchsky-v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/witchsky-v${{ github.run_number }}.apk
