name: Deploy web

on:
  push:
    branches: [main, main-3]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # EXPO_PUBLIC_* values are inlined into the bundle at build time, so they
      # have to be set here. A value set in the Pages dashboard is too late.
      EXPO_PUBLIC_ENV: production
      EXPO_PUBLIC_OAUTH_BASE_URL: ${{ vars.OAUTH_BASE_URL || 'https://witchsky.app' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      EXPO_PUBLIC_BUNDLE_IDENTIFIER: ${{ github.sha }}
      EXPO_PUBLIC_BUNDLE_DATE: ${{ github.run_id }}
      NODE_OPTIONS: --max-old-space-size=8192
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # package.json requires node >=24.22.1 and devEngines pins pnpm 11.28.5.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # This fork has no nightly catalog job, so the committed .po files drift:
      # strings added to the source never reach the catalog, and the build then
      # ships the message ID (e.g. "HqoNLF") instead of text. intl:build is
      # extract + compile, so the catalogs match the source before bundling.
      - name: Build translations
        run: pnpm intl:build

      - name: Build web
        run: pnpm build-web

      # Cloudflare Pages rejects any file over 25 MiB, and the main bundle's
      # source map is ~38 MiB. Maps are only used by the Sentry upload inside
      # build-web (which has already run by now) and are never requested by
      # the app, so strip them before uploading.
      - name: Strip source maps
        run: find dist -name '*.map' -type f -delete

      # Tree shaking can prune chroma-js's format registrations, which makes
      # every chroma('#rrggbb') throw "unknown format" at runtime. Static
      # builds can't catch it, so assert the registration survived. See
      # docs/web-build.md.
      - name: Check chroma formats survived tree shaking
        run: |
          if ! grep -rq '\[3,4,5,6,7,8,9\]' dist --include='*.js'; then
            echo "chroma-js hex format registration is missing from the bundle."
            echo "chroma('#rrggbb') will throw 'unknown format' at runtime."
            echo "Fix src/platform/chroma-formats.web.ts; see docs/web-build.md."
            exit 1
          fi
          echo "OK: chroma hex registration present"

      - name: Check Pages size limits
        run: |
          oversized=$(find dist -type f -size +25M)
          if [ -n "$oversized" ]; then
            echo "These files exceed the Cloudflare Pages 25 MiB limit:"
            echo "$oversized"
            exit 1
          fi
          echo "OK: $(find dist -type f | wc -l) files, largest $(du -sh dist | cut -f1) total"

      - name: Check browser support
        run: pnpm check-web-browser-support

      - name: Deploy to Cloudflare Pages
        run: >
          pnpm exec wrangler pages deploy dist
          --project-name="${{ vars.CF_PAGES_PROJECT || 'witchsky' }}"
          --branch="${{ github.ref_name }}"
          --commit-hash="${{ github.sha }}"
          --commit-message="${{ github.event.head_commit.message || github.sha }}"
