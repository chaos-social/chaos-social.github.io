<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#ED5345">
    <meta name="color-scheme" content="light dark">
    <!--
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <!--
      Preconnect to essential domains
    -->
    <link rel="preconnect" href="https://bsky.social">
    <link rel="preconnect" href="https://go.bsky.app">
    <title>Witchsky</title>
    <meta name="description" content="Social media as it should be. Find your community among millions of users, unleash your creativity, and have some fun again." />
    <link rel="manifest" href="/pwa/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon-180.png">

    <link rel="preload" as="font" type="font/woff2" href="/static/fonts/InterVariable.woff2" crossorigin>

    <style>
      /**
       * Minimum styles required to render splash.
       *
       * ALL OTHER STYLES BELONG IN `src/style.css`
       *
       * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
       */
      @font-face {
        font-family: 'InterVariable';
        src: url(/static/fonts/InterVariable.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'InterVariableItalic';
        src: url(/static/fonts/InterVariable-Italic.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: italic;
        font-display: swap;
      }
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        /* Platform-specific reset */
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        font-synthesis-weight: none;
      }
      :root {
        --text: #281c1c;
        --background: #fefbfb;
        --backgroundLight: #f5f2f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --text: #fefbfb;
          --background: #281c1c;
          --backgroundLight: #2f201f;
        }
      }
      html,
      body,
      #root {
        display: flex;
        flex: 1 0 auto;
        min-height: 100dvh;
        width: 100%;
      }
      html.theme--light {
        color-scheme: light;
        background-color: #fefbfb;
        --text: #281c1c;
        --background: #fefbfb;
        --backgroundLight: #f5f2f1;
      }
      html.theme--dark {
        color-scheme: dark;
        background-color: #281c1c;
        --text: #fefbfb;
        --background: #281c1c;
        --backgroundLight: #2f201f;
      }
      html.theme--dim {
        color-scheme: dark;
        background-color: #281c1c;
        --text: #fefbfb;
        --background: #281c1c;
        --backgroundLight: #2f201f;
      }
      #splash {
        display: flex;
        position: fixed;
        width: 125px;
        left: 50%;
        top: 50%;
        transform: translateX(-50%) translateY(-50%) translateY(-50px);
      }
      /**
       * We need these styles to prevent shifting due to scrollbar show/hide on
       * OSs that have them enabled by default. This also handles cases where the
       * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
       * shift the content, by forcing the page to show a scrollbar.
       */
      body {
        width: 100%;
        overflow-y: scroll;
      }
    </style>
    <style>html, body, #root { background-color: var(--background); }</style>
    <script>
      try {
      const theme = localStorage.getItem('ALF_THEME')
      if (['light', 'dark', 'dim'].includes(theme)) document.documentElement.classList.add(`theme--${theme}`)
      const cached = JSON.parse(localStorage.getItem('WITCHSKY_SPLASH') || 'null')
      const mode = cached?.mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : cached?.mode
      const saved = cached?.[mode]
      if (saved && ['light', 'dark'].includes(saved.scheme) &&
          [saved.background, saved.text, saved.surface].every(color => typeof color === 'string' && /^#[0-9a-f]{6}$/i.test(color))) {
        const style = document.documentElement.style
        style.setProperty('--background', saved.background)
        style.setProperty('--text', saved.text)
        style.setProperty('--backgroundLight', saved.surface)
        if (typeof saved.accent === 'string' && /^#[0-9a-f]{6}$/i.test(saved.accent)) {
          style.setProperty('--splash-logo', saved.accent)
        }
        style.colorScheme = saved.scheme
        style.backgroundColor = saved.background
      }
    } catch {}
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--background').trim())
  </script>
  </head>

  <body>
    <noscript>
      <form
        action=""
        style="
          background-color: #fff;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <h1 lang="en">Witchsky</h1>
          <p lang="en">Social media as it should be. Find your community among millions of users, unleash your creativity, and have some fun again.</p>
          <div data-nosnippet>
            <p lang="en">Enable JavaScript to use Witchsky.</p>
            <p lang="en" style="margin: 20px 0;">
              <button
                type="submit"
                style="
                  background-color: #ed5345;
                  border-radius: 100px;
                  border: none;
                  box-shadow: none;
                  color: #fff;
                  cursor: pointer;
                  font-weight: bold;
                  line-height: 20px;
                  padding: 6px 16px;
                "
              >
                Reload
              </button>
            </p>
          </div>
        </div>
      </form>
    </noscript>
