<!DOCTYPE html>
<html lang="en">
	<head>
		<title>VNDS player</title>
		<meta charset="utf-8">
		<meta name="author" content="VaYurik [aka DOOMer]">
		<meta name="description" content="VNDS interpreter">
		
		<script src="jquery-3.3.1.min.js"></script>
		<script src="jquery.smoke.effect.js"></script>
		<script src="functions.js"></script>
		<script src="vnds.class.js"></script>

		<link rel="stylesheet" href="styles.css">
	</head>

	<body>
		<noscript>
			<p>Enable JavaScript!</p>
		</noscript>
		<audio id="music" preload="auto"></audio>
		<audio id="sound" preload="auto"></audio>
		<audio id="sfx" preload="auto"></audio>
		<section id="main_screen">
			<h2>Choose a game</h2>
			<section id="main_menu"></section>
		</section>
		<section id="game_screen" class="centered">
			<div id="overlay"></div>
			<video id="video" width="100%" height="100%" preload="auto"></video>
			<div id="background"></div>
			<div id="relay"></div>
			<section id="sprites"></section>
			<section id="game_menu" class="centered">
				<button id="game_menu_start">Start</button>
				<button id="game_menu_cont">Continue</button>
				<button id="game_menu_save">Save</button>
				<button id="game_menu_load">Load</button>
				<button id="game_menu_config">Settings</button>
				<button id="game_menu_exit">Quit game</button>
			</section>
			<section id="choice_menu" class="centered"></section>
			<section id="config_menu" class="centered">
				<h2>Settings</h2>
				<label for="config_menu_text_size">Text size</label>
				<input type="range" min="0" max="2" step="1" value="0" id="config_menu_text_size">
				<div>
					<input type="checkbox" id="config_menu_is_fullscreen">
					<label for="config_menu_is_fullscreen">Fullscreen</label>
				</div>
				<label for="config_menu_text_speed">Text speed</label>
				<input type="range" min="0" max="20" step="1" value="5" id="config_menu_text_speed">
				<label for="config_menu_auto_text_pause">Auto-read pause</label>
				<input type="range" min="0" max="20" step="1" value="12" id="config_menu_auto_text_pause">
				<div>
					<input type="checkbox" id="config_menu_is_skip_unread" checked>
					<label for="config_menu_is_skip_unread">Skip unread text</label>
				</div>
				<label for="config_menu_sound_volume">Sound volume</label>
				<input type="range" min="0" max="9" step="1" value="5" id="config_menu_sound_volume">
				<fieldset>
					<div>
						<input type="radio" name="log" value="0" id="config_menu_log_0" checked>
						<label for="config_menu_log_0">console off</label>
					</div>
					<div>
						<input type="radio" name="log" value="1" id="config_menu_log_1">
						<label for="config_menu_log_1">VNDS commands</label>
					</div>
					<div>
						<input type="radio" name="log" value="2" id="config_menu_log_2">
						<label for="config_menu_log_2">all commands</label>
					</div>
				</fieldset>
				<button id="config_menu_exit">Close</button>
			</section>
			<section id="save_load_menu">
				<div id="save_load_menu_left"></div>
				<div id="save_load_menu_right"></div>
			</section>
			<section id="message_box">
				<div id="message_box_menu">
					<a href="#" id="message_box_menu_load">Load</a>
					<a href="#" id="message_box_menu_save">Save</a>
					<a href="#" id="message_box_menu_skip">Skip</a>
					<a href="#" id="message_box_menu_auto">Auto</a>
					<a href="#" id="message_box_menu_sound">Sound</a>
					<a href="#" id="message_box_menu_menu">Menu</a>
					<a href="#" id="message_box_menu_help">?</a>
					<a href="#" id="message_box_menu_hide">X</a>
				</div>
				<div id="message_box_name"></div>
				<div id="message_box_text"></div>
				<a href="#" id="message_box_next">&#8680;</a>
			</section>
		</section>
		<section id="info">
			<ul>
				<li>PHP: <span id="info_php_enabled"></span></li>
				<li>LUA: <span id="info_lua_enabled"></span></li>
				<li>Screen: <span id="info_screen_resolution"></span></li>
				<li>&nbsp</li>
				<li>Game: <span id="info_game_name"></span></li>
				<li>Resolution: <span id="info_game_resolution"></span></li>
				<li>Script: <span id="info_script_name"></span></li>
				<li>Line: <span id="info_script_line_num"></span></li>
				<li>Background colour: <span id="info_bg_color"></span></li>
				<li>Background: <span id="info_background"></span></li>
				<li>Sprite: <span id="info_sprites"></span></li>
				<li>Animation: <span id="info_animation"></span></li>
				<li>Video: <span id="info_video"></span></li>
				<li>Music: <span id="info_music"></span></li>
				<li>Sound: <span id="info_sound"></span></li>
				<li>Sound effect: <span id="info_sfx"></span></li>
			</ul>
			<div id="info_show">Info</div>
		</section>
		<section id="modal_screen">
			<div id="modal_box" class="centered">
				<div id="modal_box_text"></div>
				<button id="modal_box_next">OK</button>
			</div>
		</section>
		<section id="cache"></section>
		<script>
			/*
			 * Run the engine at the game's own resolution and let the embed scale
			 * the whole iframe up to fit. Its CSS, its fixed 120px message box
			 * and its font scale math all assume native size; rendering it at a
			 * larger viewport is what made text overflow the box.
			 */
			(function () {
				var p = new URLSearchParams(location.search)
				var w = Number(p.get('w'))
				var h = Number(p.get('h'))
				if (w > 0 && h > 0) {
					document.documentElement.style.width = w + 'px'
					document.documentElement.style.height = h + 'px'
					document.body.style.width = w + 'px'
					document.body.style.height = h + 'px'
				}

				/*
				 * The engine's floor is 640x480 and it rejects anything smaller,
				 * silently falling back to the game's native size. At native size
				 * that is exactly what we want, so let it through.
				 */
				config.min_width = 100
				config.min_height = 100

				/*
				 * Its fullscreen branch fills the window instead of the game
				 * resolution, which is the behaviour we do NOT want here.
				 */
				config.is_fullscreen = false
			})()
		</script>
	</body>
</html>
