when:
  - event: ["push"]
    branch: ["main", "prod"]

engine: microvm
image: alpine

steps:
  - name: Install toolchain
    command: |
      apk add --no-cache nodejs-current pnpm
      node --version
      pnpm --version

  - name: Install dependencies
    command: pnpm install --frozen-lockfile

  - name: Write build environment
    command: |
      set -eu

      release_version="$(node --print "require('./package.json').version")"
      bundle_date="$(date -u +%y%m%d%H)"

      case "$TANGLED_REF_NAME" in
        main) oauth_base_url="https://canary.witchsky.app" ;;
        prod) oauth_base_url="https://witchsky.app" ;;
        *) echo "Refusing to build unexpected branch: $TANGLED_REF_NAME" >&2; exit 1 ;;
      esac

      printf '%s\n' \
        "EXPO_PUBLIC_ENV=production" \
        "EXPO_PUBLIC_RELEASE_VERSION=$release_version" \
        "EXPO_PUBLIC_BUNDLE_IDENTIFIER=$TANGLED_SHA" \
        "EXPO_PUBLIC_BUNDLE_DATE=$bundle_date" \
        "EXPO_PUBLIC_OAUTH_BASE_URL=$oauth_base_url" \
        > .env

  - name: Build
    environment:
      NODE_OPTIONS: "--max-old-space-size=2560"
      # The 4 GiB runner cannot hold the experimental optimizer's full AST graph.
      EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH: "0"
      EXPO_UNSTABLE_TREE_SHAKING: "0"
    command: |
      pnpm intl:build
      pnpm build-web

  - name: Publish to Cloudflare Pages
    command: |
      set -eu

      : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured in Tangled's pipeline secrets}"
      : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured in Tangled's pipeline secrets}"

      case "$TANGLED_REF_NAME" in
        main) cloudflare_branch="canary" ;;
        prod) cloudflare_branch="main" ;;
        *) echo "Refusing to deploy unexpected branch: $TANGLED_REF_NAME" >&2; exit 1 ;;
      esac

      node ./scripts/prepare-pages-assets.js

      pnpm exec wrangler pages deploy ./dist \
        --project-name witchsky \
        --branch "$cloudflare_branch" \
        --commit-hash "$TANGLED_SHA"
